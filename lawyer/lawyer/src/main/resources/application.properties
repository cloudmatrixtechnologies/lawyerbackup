spring.application.name=lawyer

# Local secrets (DB_PASSWORD, ADMIN_PASSWORD) live in a git-ignored .env file
# in the project folder; real environment variables take precedence.
# ../.env covers running the jar from inside target/ (java -jar lawyer-*.jar).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Only reachable through the Angular/Node server's /api proxy
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}

# ── PostgreSQL ──
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lawyer-portal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Table is created by schema.sql; Hibernate only checks it matches the entity
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Admin session ──
app.admin.password=${ADMIN_PASSWORD:}
server.servlet.session.timeout=12h
server.servlet.session.cookie.name=SMS_ADMIN
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# Local time zone for the "from / to" date filters
app.timezone=Asia/Kolkata
