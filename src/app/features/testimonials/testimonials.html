<!-- testimonials.html -->
<section id="testimonials" class="testi-section">

  <div class="testi-header">
    <div class="eyebrow">Testimonials</div>
    <h2 class="section-heading">What Our Clients<br><em class="italic-gold">Say About Us</em></h2>
    <div class="gold-divider center"></div>
  </div>

  <!-- Slider track -->
  <div class="testi-track-wrap">
    <div class="testi-track"
         (touchstart)="onTouchStart($event)"
         (touchend)="onTouchEnd($event)"
         [style.transform]="'translateX(-' + (activeIdx * 100 / visible) + '%)'">
      @for (t of testimonials; track t.name) {
        <div class="testi-card">
          <div class="testi-quote-mark">"</div>
          <div class="testi-stars">
            @for (s of [1,2,3,4,5]; track s) {
              <svg width="13" height="13" viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="#B89650"/>
              </svg>
            }
          </div>
          <p class="testi-text">{{ t.text }}</p>
          <div class="testi-footer">
            <div class="testi-avatar">{{ t.name[0] }}</div>
            <div>
              <div class="testi-name">{{ t.name }}</div>
              <div class="testi-role">{{ t.role }}</div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Controls -->
  <div class="testi-controls">
    <button class="testi-btn" (click)="prev()" [disabled]="activeIdx === 0" aria-label="Previous">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <div class="testi-dots">
      @for (t of testimonials; track t.name; let i = $index) {
        @if (i < testimonials.length - visible + 1) {
          <button class="testi-dot" [class.testi-dot--active]="activeIdx === i" (click)="goTo(i)"></button>
        }
      }
    </div>
    <button class="testi-btn" (click)="next()" [disabled]="activeIdx >= testimonials.length - visible" aria-label="Next">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

</section>
