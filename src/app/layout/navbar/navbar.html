<!-- navbar.html -->
<header class="site-header" [class.scrolled]="scrolled">

  <!-- Top strip -->
  <div class="header-strip" [class.strip-hidden]="scrolled">
    <div class="strip-left">
      <a href="tel:+919345170567" class="strip-link">
        <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
        </svg>
        (+91) 93451 70567
      </a>
      <span class="strip-sep">|</span>
      <span class="strip-link">
        <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        Ammapet, Salem
      </span>
    </div>
    <div class="strip-right">
      <span class="strip-tamil" lang="ta">இலவச சட்ட ஆலோசனை மையம்</span>
      <a href="#contact" class="strip-cta">Free Legal Advice</a>
    </div>
  </div>

  <!-- Main nav -->
  <nav class="main-nav">
    <a href="#home" class="logo">
      <div class="logo-icon-ring">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="22" stroke="#B89650" stroke-width="1.5"/>
          <line x1="24" y1="10" x2="24" y2="38" stroke="#B89650" stroke-width="1.2"/>
          <line x1="12" y1="18" x2="36" y2="18" stroke="#B89650" stroke-width="1.2"/>
          <line x1="12" y1="18" x2="12" y2="26" stroke="#B89650" stroke-width="1"/>
          <line x1="36" y1="18" x2="36" y2="26" stroke="#B89650" stroke-width="1"/>
          <ellipse cx="12" cy="27" rx="6" ry="2.5" stroke="#B89650" stroke-width="1"/>
          <ellipse cx="36" cy="27" rx="6" ry="2.5" stroke="#B89650" stroke-width="1"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-name">SMS Law Associates</span>
        <span class="logo-sub">Justice · Trust · Solutions</span>
      </div>
    </a>

    <ul class="nav-links">
      @for (item of links; track item.id) {
        <li>
          <a [href]="item.href"
             class="nav-link"
             [class.nav-link--active]="active === item.id"
             (click)="setActive(item.id)">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <button class="hamburger" (click)="toggleMenu()" aria-label="Menu">
      <span [style.transform]="open ? 'rotate(45deg) translate(5px,5px)' : ''"></span>
      <span [style.opacity]="open ? '0' : '1'"></span>
      <span [style.transform]="open ? 'rotate(-45deg) translate(5px,-5px)' : ''"></span>
    </button>
  </nav>

  <!-- Mobile menu -->
  <div class="mobile-panel" [class.mobile-panel--open]="open">
    <ul>
      @for (item of links; track item.id) {
        <li>
          <a [href]="item.href" class="mobile-link" (click)="closeMenu()">{{ item.label }}</a>
        </li>
      }
      <li><a href="#contact" class="mobile-cta" (click)="closeMenu()">Book Consultation</a></li>
    </ul>
  </div>
</header>
